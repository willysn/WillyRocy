<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Willian & Rocío 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #1a1a1a, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
    }

    .envelope {
      position: relative;
      width: clamp(260px, 60vw, 400px);
      height: clamp(180px, 40vh, 280px);
      perspective: 1200px;
      cursor: pointer;
    }

    .cover {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .left-page, .right-page {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      background: #2e2e2e;
      border: 2px solid #d4af37;
      backface-visibility: hidden;
      transition: transform 1.5s ease-in-out;
    }

    .left-page {
      left: 0;
      border-right: none;
      transform-origin: left center;
    }

    .right-page {
      right: 0;
      border-left: none;
      transform-origin: right center;
    }

    /* Logo dorado como botón */
    .logo-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(100px, 25vw, 180px);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .logo-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
      filter: drop-shadow(0 0 10px #d4af37);
    }

    .text {
      position: absolute;
      top: 75%;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: clamp(14px, 3vw, 18px);
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      z-index: 10;
    }

    /* Animación apertura libro */
    .open .left-page {
      transform: rotateY(-160deg);
    }

    .open .right-page {
      transform: rotateY(160deg);
    }

    /* Logo dorado emergente */
    .logo-final {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 1.5s ease-out, opacity 1.5s ease-out;
      z-index: 20;
      width: clamp(150px, 40vw, 300px);
    }

    .show-logo {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div class="envelope" id="envelope">
    <div class="cover">
      <div class="left-page"></div>
      <div class="right-page"></div>
      <img src="logo.png" alt="Logo W&R" class="logo-btn" id="logoBtn">
      <div class="text">¡Toca aquí!</div>
    </div>
  </div>

  <!-- Logo dorado emergente -->
  <img src="logo.png" alt="Logo W&R" class="logo-final" id="logoFinal">

  <!-- Música romántica -->
  <audio autoplay loop>
    <source src="audio/musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const envelope = document.getElementById('envelope');
    const logoBtn = document.getElementById('logoBtn');
    const logoFinal = document.getElementById('logoFinal');

    logoBtn.addEventListener('click', () => {
      envelope.classList.add('open');

      // Mostrar logo suavemente
      setTimeout(() => {
        logoFinal.classList.add('show-logo');
      }, 1200);

      // Redirigir a la invitación
      setTimeout(() => {
        window.location.href = "Invitacion.html";
      }, 3000);
    });
  </script>

</body>
</html>
